<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin ETF Flows</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: #0d0d0d;
      color: #e0e0e0;
    }
    h1 { color: #f7931a; margin-bottom: 0.25rem; }
    h2 { color: #aaa; font-size: 1.1rem; margin-top: 2.5rem; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
    img { width: 100%; border-radius: 8px; margin-top: 0.5rem; background: #fff; }
    footer { margin-top: 3rem; color: #555; font-size: 0.8rem; text-align: center; }
  </style>
</head>
<body>
  <h1>Bitcoin ETF Flows</h1>
  <p class="subtitle">Updated daily &mdash; <span id="updated"></span></p>

  <h2>Daily Spot Bitcoin ETF Net Flows vs BTC Price</h2>
  <img src="daily_flows.png" alt="Daily ETF flows vs BTC price">

  <h2>Cumulative Spot Bitcoin ETF Net Flows vs BTC Price</h2>
  <img src="cumulative_flows.png" alt="Cumulative ETF flows vs BTC price">

  <h2>BTC Price with 50-Day and 200-Day EMA</h2>
  <img src="btc_ema.png" alt="BTC price with EMAs">

  <footer>Data: Farside Investors &amp; Yahoo Finance &middot; Charts generated automatically</footer>

  <script>
    // Show the image file's last-modified time if available, else today
    const img = new Image();
    img.onload = function() {
      document.getElementById('updated').textContent = new Date().toLocaleDateString('en-GB', {
        day: 'numeric', month: 'long', year: 'numeric'
      });
    };
    img.src = 'daily_flows.png?' + Date.now();
    document.getElementById('updated').textContent = new Date().toLocaleDateString('en-GB', {
      day: 'numeric', month: 'long', year: 'numeric'
    });
  </script>
</body>
</html>
