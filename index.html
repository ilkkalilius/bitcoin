<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Charts</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; background: #0d0d0d; color: #e0e0e0; }
    h1 { margin-bottom: 0.25rem; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 2.5rem; }

    .section-title { color: #aaa; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; margin: 2.5rem 0 1rem; border-bottom: 1px solid #222; padding-bottom: 0.4rem; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .card { background: #171717; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1.25rem 1.5rem; text-decoration: none; color: inherit; transition: border-color 0.15s; display: block; }
    .card:hover { border-color: #555; }
    .card .label { font-size: 0.75rem; color: #888; margin-bottom: 0.3rem; font-family: monospace; }
    .card .name { font-size: 1rem; font-weight: 600; color: #e0e0e0; }
    .card.bitcoin .name { color: #f7931a; }

    .comparison { margin-top: 1.5rem; }
    .comparison img { width: 100%; border-radius: 8px; background: #fff; }

    footer { margin-top: 3rem; color: #555; font-size: 0.8rem; text-align: center; }
  </style>
</head>
<body>
  <h1>Market Charts</h1>
  <p class="subtitle">Updated daily &mdash; <span id="updated"></span></p>

  <div class="section-title">Bitcoin</div>
  <div class="cards">
    <a class="card bitcoin" href="bitcoin.html">
      <div class="label">Spot ETF flows &amp; price</div>
      <div class="name">Bitcoin (BTC)</div>
    </a>
  </div>

  <div class="section-title">ETF Comparison</div>
  <div class="comparison">
    <img src="etf_comparison.png" alt="ETF comparison chart">
  </div>

  <div class="section-title">Individual ETFs</div>
  <div class="cards">
    <a class="card" href="nasdaq100.html">
      <div class="label">LU1681038243 &middot; 6AQQ.DE</div>
      <div class="name">Amundi Nasdaq-100</div>
    </a>
    <a class="card" href="msci_value.html">
      <div class="label">IE00BP3QZB59 &middot; IS3S.DE</div>
      <div class="name">iShares MSCI World Value</div>
    </a>
    <a class="card" href="msci_quality.html">
      <div class="label">IE00BL25JL35 &middot; XDEQ.DE</div>
      <div class="name">Xtrackers MSCI World Quality</div>
    </a>
  </div>

  <footer>Data: Farside Investors &amp; Yahoo Finance</footer>

  <script>
    document.getElementById('updated').textContent = new Date().toLocaleDateString('en-GB', {
      day: 'numeric', month: 'long', year: 'numeric'
    });
  </script>
</body>
</html>
